services:
  postgres:
    image: postgres:16.4
    container_name: postgres
    ports:
      # If you already run PostgreSQL natively, it will be holding host port
      # 5432 and silently shadow this container -- connections from the host
      # reach the native server instead and fail auth. Override the host side
      # with POSTGRES_HOST_PORT=5433 (and DATABASE_URL to match). The
      # in-container port stays 5432, so postgres:5432 URLs are unaffected.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: hospital
      POSTGRES_PASSWORD: hospital
      POSTGRES_DB: hospital
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs in filename order on first initialisation only: the airflow
      # metadata database, then the application schema.
      - ./storage/000-airflow-db.sql:/docker-entrypoint-initdb.d/000-airflow-db.sql:ro
      - ./storage/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital -d hospital"]
      interval: 5s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # ---------------------------------------------------------------------
  # Serving API. Reads the rows the streaming and batch jobs write, so it
  # runs with API_REPOSITORY=postgres rather than the in-memory default.
  # ---------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: api
    ports:
      - "8000:8000"
    environment:
      API_REPOSITORY: postgres
      DATABASE_URL: postgresql://hospital:hospital@postgres:5432/hospital
    volumes:
      - .:/opt/project
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # Airflow (LocalExecutor). One-shot init migrates the metadata database
  # and creates the admin user; the scheduler runs the DAG and the
  # webserver serves the UI on :8080.
  # ---------------------------------------------------------------------
  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    container_name: airflow-init
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://hospital:hospital@postgres:5432/airflow
      # Lets the DAG import batch/, common/, observability/ from the repo.
      PYTHONPATH: /opt/project
      # _data_root() in the DAG resolves data/ paths against this.
      DATA_ROOT: /opt/project
      # Used by write_report_task to reach the application database.
      DATABASE_URL: postgresql://hospital:hospital@postgres:5432/hospital
    volumes:
      - .:/opt/project
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: /bin/bash
    # `|| true` on user creation so re-running init is not an error once the
    # admin user already exists.
    command:
      - -c
      - >-
        airflow db migrate &&
        airflow users create --username admin --password admin
        --firstname Admin --lastname User --role Admin
        --email admin@example.com || true

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    container_name: airflow-scheduler
    environment: *airflow-env
    volumes:
      - .:/opt/project
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    restart: unless-stopped

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    container_name: airflow-webserver
    ports:
      - "8080:8080"
    environment: *airflow-env
    volumes:
      - .:/opt/project
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    restart: unless-stopped

volumes:
  postgres-data:



