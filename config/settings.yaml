sim_clock:
  real_start: "2026-09-27T18:21:28Z"
  sim_start_date: "2026-01-01"
  sim_day_seconds: 300

kafka:
  bootstrap_servers: "localhost:9092"
  topic_vitals: "vitals-stream"
  topic_dlq: "vitals-dlq"
  partitions: 3
  replication_factor: 1

simulator:
  num_patients: 20
  emit_interval_seconds: 3
  spike_probability: 0.05
  null_field_probability: 0.01
  duplicate_probability: 0.005
  late_event_probability: 0.02
  seed: 42

paths:
  # Where the lab simulator drops a new daily CSV.
  landing_labs: "data/landing/labs"
  # Where ingestion/lab_loader.py moves files that pass validation. This is
  # the handoff point: the Airflow DAG consumes validated files from here,
  # never from landing_labs (the loader empties that folder as it works).
  landing_processed: "data/landing/processed"
  # Where the loader moves files that fail validation.
  landing_rejected: "data/landing/rejected"
  # Parquet vitals archive written by the Spark streaming job, partitioned
  # as date=YYYY-MM-DD/ and read back by the daily batch job.
  archive_vitals: "data/archive/vitals"

observability:
  producer_metrics_port: 8001
  lab_loader_metrics_port: 8002

